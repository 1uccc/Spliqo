<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </linearGradient>
    <radialGradient id="flameGlow512" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#b45309" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spliqoFlame512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#2e2e38" stroke-width="4"/>

  <!-- Smooth radial glow behind flame (no rectangular artifacts) -->
  <circle cx="256" cy="256" r="200" fill="url(#flameGlow512)"/>

  <!-- Perfectly Centered Flame Graphic -->
  <g transform="translate(58, 49.75) scale(16.5)">
    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"
          fill="url(#spliqoFlame512)" 
          stroke="#b45309" 
          stroke-width="0.3" 
          stroke-linejoin="round"/>
  </g>
</svg>
